name: padel
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Poslat jen testovací zprávu"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: padel
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python hlidac.py ${{ github.event.inputs.test == 'true' && '--test' || '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      - name: Uložit stav
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add --all -- stav.json || true
          git diff --staged --quiet || (git commit -m "stav" && git push)
